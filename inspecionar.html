<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff4b26"><title>QR-FIT | Conferir vídeos</title><style>body{margin:0;background:#141719;color:#f1ede4;font:16px system-ui;padding:20px}main{max-width:650px;margin:auto}h1{font-size:24px}p{line-height:1.55;color:#c7cbce}.panel{background:#232629;padding:18px;border:1px solid #444;border-radius:14px;margin:20px 0}input{max-width:100%;margin:12px 0}button{background:#ff4b26;color:#171717;border:0;border-radius:9px;padding:12px 16px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}li{padding:5px 0}small{color:#aaa}a{color:#ff795a}</style></head><body><main><h1>QR-FIT-ACADEMIA</h1><p>Verificador de vídeos do Leg Press. Escolha os três ZIPs do seu celular. A leitura acontece <b>no próprio aparelho</b>; nenhum arquivo é enviado pela internet.</p><div class="panel"><label for="files"><b>Selecionar ZIPs</b></label><p><input id="files" type="file" accept=".zip,application/zip" multiple></p><div id="status">Aguardando arquivos.</div></div><div id="result"></div><button id="copy" style="display:none">Copiar relatório</button><p><small>Este é apenas um verificador técnico, não a versão final do aplicativo.</small></p></main><script>
const enc=new TextDecoder('utf-8'); let report='';
function readZip(buffer){const v=new DataView(buffer),n=v.byteLength;let at=-1;for(let i=n-22;i>=Math.max(0,n-65557);i--){if(v.getUint32(i,true)===0x06054b50){at=i;break}}if(at<0)throw Error('Não encontrei o índice ZIP (EOCD).');const count=v.getUint16(at+10,true),off=v.getUint32(at+16,true);let p=off,items=[];for(let i=0;i<count;i++){if(p+46>n||v.getUint32(p,true)!==0x02014b50)throw Error('Índice ZIP inconsistente na entrada '+i);const comp=v.getUint32(p+20,true),uncomp=v.getUint32(p+24,true),len=v.getUint16(p+28,true),extra=v.getUint16(p+30,true),comment=v.getUint16(p+32,true);const flags=v.getUint16(p+8,true),method=v.getUint16(p+10,true);const name=enc.decode(new Uint8Array(buffer,p+46,len));items.push({name,comp,uncomp,flags,method});p+=46+len+extra+comment}return items}
document.getElementById('files').addEventListener('change',async e=>{let f=[...e.target.files],out=[],text=[];document.getElementById('result').replaceChildren();for(const file of f){document.getElementById('status').textContent='Lendo '+file.name+'...';try{const entries=readZip(await file.arrayBuffer());const matches=entries.filter(x=>/leg.?press|panturr|quadr[ií]cep|calf|press.?45/i.test(x.name));const videos=entries.filter(x=>/\.(mp4|webm|gif)$/i.test(x.name));out.push('<div class="panel"><h2>'+file.name.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</h2><p>'+entries.length+' arquivos, '+videos.length+' vídeos ou GIFs; '+matches.length+' nomes relacionados ao Leg Press.</p><pre>'+matches.map(x=>x.name.replaceAll('&','&amp;').replaceAll('<','&lt;')).join('\n')+'</pre></div>');text.push('ARQUIVO: '+file.name+'\nTOTAL: '+entries.length+'\nVÍDEOS: '+videos.length+'\nPOSSÍVEIS LEG PRESS:\n'+matches.map(x=>x.name).join('\n')+'\n');}catch(err){out.push('<div class="panel"><b>Erro no ZIP '+file.name.replaceAll('<','&lt;')+':</b> '+String(err.message).replaceAll('<','&lt;')+'</div>');text.push('ERRO '+file.name+': '+err.message)}}document.getElementById('result').innerHTML=out.join('');document.getElementById('status').textContent='Verificação concluída.';report=text.join('\n');document.getElementById('copy').style.display='block'});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(report);document.getElementById('status').textContent='Relatório copiado. Cole na conversa.'}catch(e){document.getElementById('status').textContent='Não foi possível copiar automaticamente.'}});
</script></body></html>
